plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }

    irisRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    api "net.fabricmc:fabric-language-kotlin:${rootProject.fabric_kotlin_version}"
    api "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    compileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    irisRuntime("net.caffeinemc:sodium-fabric:${rootProject.sodium_version}+mc${rootProject.minecraft_version}") { transitive false }
    irisRuntime("maven.modrinth:iris:${rootProject.iris_version}+${rootProject.minecraft_version}-fabric") { transitive false }

    if (rootProject.enable_sodium.toBoolean() || rootProject.enable_iris.toBoolean()) {
        localRuntime("net.caffeinemc:sodium-fabric:${rootProject.sodium_version}+mc${rootProject.minecraft_version}") { transitive false }
    }
    if (rootProject.enable_iris.toBoolean()) {
        localRuntime("maven.modrinth:iris:${rootProject.iris_version}+${rootProject.minecraft_version}-fabric") { transitive false }
    }

    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }
}

loom {
    runs {
        clientWithIris {
            inherit client
            displayName = 'Minecraft Client with Iris'
            preferGradleTask = true
        }
    }
}

tasks.named('runClientWithIris') {
    description = 'Starts the Minecraft client with Iris and Sodium'
    classpath configurations.irisRuntime
}

tasks.named('processResources') {
    from(project(':common').layout.projectDirectory.dir('src/main/resources')) {
        include 'assets/aamod/icon.png'
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    exclude 'architectury.common.json'
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        create('mavenFabric', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
