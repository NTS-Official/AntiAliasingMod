plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    mods {
        main {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }

    irisRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
        content { includeGroupByRegex 'net\\.neoforged.*' }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    api "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    localRuntime("thedarkcolour:kotlinforforge-neoforge:${rootProject.kotlin_for_forge_version}") {
        exclude group: 'net.neoforged.fancymodloader', module: 'loader'
    }

    irisRuntime("net.caffeinemc:sodium-neoforge:${rootProject.sodium_version}+mc${rootProject.minecraft_version}") { transitive false }
    irisRuntime("maven.modrinth:iris:${rootProject.iris_version}+${rootProject.minecraft_version}-neoforge") { transitive false }

    if (rootProject.enable_sodium.toBoolean() || rootProject.enable_iris.toBoolean()) {
        localRuntime("net.caffeinemc:sodium-neoforge:${rootProject.sodium_version}+mc${rootProject.minecraft_version}") { transitive false }
    }
    if (rootProject.enable_iris.toBoolean()) {
        localRuntime("maven.modrinth:iris:${rootProject.iris_version}+${rootProject.minecraft_version}-neoforge") { transitive false }
    }

    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

loom {
    runs {
        clientWithIris {
            inherit client
            displayName = 'Minecraft Client with Iris'
            preferGradleTask = true
            systemProperties.put('neoforge.disableGlValidation', 'true')
        }
    }
}

tasks.named('runClientWithIris') {
    description = 'Starts the Minecraft client with Iris and Sodium'
    classpath configurations.irisRuntime
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    exclude 'architectury.common.json'
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        create('mavenNeoForge', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
