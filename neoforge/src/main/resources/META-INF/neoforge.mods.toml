modLoader = "javafml"
loaderVersion = "[2,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''A Mod that aims at implementing antialiasing features to Minecraft.'''
iconFile = "assets/aamod/icon.png"

[modproperties.${mod_id}]
"sodium:config_api_user" = "${mod_group}.client.compat.sodium.SodiumConfigEntryPoint"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "[${kotlin_for_forge_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "optional"
versionRange = "[${sodium_version},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "iris"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "aamod.mixins.json"

[[mixins]]
config = "aamod.client.mixins.json"
