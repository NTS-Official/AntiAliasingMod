architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.java.srcDir 'src/main/kotlin'

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    compileOnly "dev.architectury:architectury-injectables:${rootProject.architectury_injectables_version}"
    compileOnly("net.caffeinemc:sodium-fabric-api:${rootProject.sodium_version}+mc${rootProject.minecraft_version}") { transitive false }
    compileOnly("net.caffeinemc:sodium-fabric:${rootProject.sodium_version}+mc${rootProject.minecraft_version}") { transitive false }
    compileOnly("maven.modrinth:iris:${rootProject.iris_version}+${rootProject.minecraft_version}-fabric") { transitive false }
}
