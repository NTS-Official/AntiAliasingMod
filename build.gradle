import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'dev.architectury.loom-no-remap' version "${loom_version}" apply false
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'com.gradleup.shadow' version "${shadow_version}" apply false
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.mod_group
    version = rootProject.mod_version
}

def metadata = [
        mod_id                    : rootProject.mod_id,
        mod_name                  : rootProject.mod_name,
        mod_version               : rootProject.mod_version,
        mod_author                : rootProject.mod_author,
        mod_license               : rootProject.mod_license,
        mod_group                 : rootProject.mod_group,
        minecraft_version         : rootProject.minecraft_version,
        java_version              : rootProject.java_version,
        fabric_loader_version     : rootProject.fabric_loader_version,
        architectury_api_version  : rootProject.architectury_api_version,
        kotlin_for_forge_version  : rootProject.kotlin_for_forge_version,
]

subprojects {
    apply plugin: 'java'
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    base {
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
            content {
                includeGroup 'net.fabricmc'
                includeGroup 'net.fabricmc.fabric-api'
            }
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
            content { includeGroupByRegex 'dev\\.architectury.*' }
        }
        maven {
            name = 'Terraformers'
            url = 'https://maven.terraformersmc.com/'
            content { includeGroup 'com.terraformersmc' }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_25
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = rootProject.java_version as int
        it.options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        inputs.properties(metadata)
        ['fabric.mod.json', 'META-INF/neoforge.mods.toml'].each { pattern ->
            filesMatching(pattern) {
                expand(metadata)
            }
        }
    }

    tasks.named('jar', Jar) {
        from(rootProject.file('LICENSE')) {
            rename { "LICENSE_${rootProject.archives_name}" }
        }
    }
}
